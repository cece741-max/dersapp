<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Hoca Paneli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>:root{--bg:#0E1621;--pn:#16202D;--cd:#1D2B3B;--ln:#2A394B;--tx:#E8EDF3;--mu:#A9B6C6;--ac:#F5B544;--ink:#1A1203}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
.app{max-width:480px;min-height:100vh;margin:auto;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:24px 16px 14px;background:var(--pn)}h1{margin:0;font-size:22px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.mut{color:var(--mu)}.sm{font-size:12px}.c{text-align:center}.ok{color:#8FD6B1}
.card,.item{background:var(--cd);border-radius:16px;padding:16px}.card p{margin:6px 0 0;white-space:pre-wrap}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;color:inherit;text-decoration:none}.grow{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--ac);color:var(--ink);font:700 15px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn.sec{background:var(--ln);color:var(--tx)}.btn.ghost{background:transparent;border:1px solid var(--ac);color:var(--ac)}.btn.ghost.row{justify-content:space-between}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1;min-height:44px;font-size:14px}
.badge{min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ac);color:var(--ink);font-size:12px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto}.chips button{flex:none;height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--cd);color:var(--tx);font:600 14px inherit;font-family:inherit}.chips .on{background:var(--ac);color:var(--ink)}
.tag{margin-left:8px;padding:2px 8px;border-radius:8px;background:var(--ln);font-size:11px}.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:22px;background:var(--ac);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.ico{width:44px;height:44px;border-radius:22px;background:var(--cd);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none}
label{display:block;margin-bottom:12px;font-size:13px;color:var(--mu);font-weight:600}.chk{display:flex;gap:8px;align-items:center}
input,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:15px inherit;font-family:inherit}.chk input{width:auto;margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.link{background:none;border:0;color:var(--mu);padding:12px;font-family:inherit}
.strip{padding:10px 14px;background:#2A2412;border:1px solid var(--ac);border-radius:10px;color:var(--ac);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:10px;flex:1}.b{max-width:82%;padding:12px 14px;background:var(--cd);border-radius:4px 16px 16px 16px;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--ac);color:var(--ink);border-radius:16px 4px 16px 16px}.b i{display:block;margin-top:4px;font-size:11px;text-align:right;opacity:.75;font-style:normal}
.compose{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}.compose input{margin:0;border-radius:24px}.send{border-radius:24px}
select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:15px inherit;font-family:inherit}
.hbtn{padding:8px 14px;border-radius:18px;background:var(--cd);color:var(--tx);font-size:13px;font-weight:600;text-decoration:none}
.btn.danger{color:#F29B9B}.card .btn.file{display:flex}
.link{background:none;border:0;color:var(--mu);font:13px inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:8px;align-self:center}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}.chk input{width:auto;margin:0}
.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login{justify-content:center;text-align:center;min-height:90vh}.err{color:#F29B9B}.strip.err{margin:0;padding:10px 14px}
.ico{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:18px;background:var(--cd);color:var(--tx);font-size:22px;text-decoration:none}

.hero{padding:28px 16px 20px;background:var(--pn);display:flex;gap:12px;align-items:flex-start}.hero h1{font-size:26px;margin:2px 0 4px;line-height:1.2;word-break:break-word}
h2.sec{margin:8px 0 0;font-size:19px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--cd);border-radius:12px;padding:1px 10px;font-size:13px;color:var(--mu);font-weight:600}
.course{display:flex;align-items:center;gap:12px;background:var(--cd);border-radius:16px;padding:16px;border-left:4px solid var(--ac);color:inherit;text-decoration:none;min-height:84px}
.cname{font-size:18px;font-weight:600;margin:6px 0 2px;line-height:1.25}.chev{font-size:30px;color:var(--mu);line-height:1}
.new{margin-top:6px;color:var(--ac);font-size:12px;font-weight:600}

.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(440px,92vw);background:var(--ac);color:#1A1203;padding:12px 14px;border-radius:14px;z-index:60;box-shadow:0 8px 24px #0008;cursor:pointer}
.toast .pv{opacity:.85}

.b.lp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}

.att{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);font:13px inherit;font-family:inherit;text-decoration:none;text-align:left;cursor:pointer;box-sizing:border-box}
.att b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.att span{color:var(--mu);font-size:12px;flex:none}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);text-decoration:none;padding:4px 0}.tabbar a.on{color:var(--ac)}
.tic{position:relative;display:flex}.dot{position:absolute;top:-5px;right:-11px;min-width:16px;height:16px;border-radius:8px;background:#E5484D;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.app.has-tabs main{padding-bottom:96px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--cd);border-radius:14px;padding:12px 14px;color:var(--tx);text-decoration:none;display:flex;flex-direction:column;gap:2px}.stat span{font-size:12px;color:var(--mu)}.stat b{font-size:26px;font-weight:600}
.stat.warn{background:#3A2F14}.stat.warn span,.stat.warn b{color:var(--ac)}
.ccard{background:var(--cd);border-radius:16px;padding:12px}.ctop{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.cbadge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.cacts{display:flex;gap:8px;margin-top:12px}.cacts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border-radius:10px;background:var(--bg);color:var(--tx);font-size:12px;text-decoration:none}
.add{padding:14px;border:1.5px dashed var(--ln);border-radius:14px;background:transparent;color:var(--mu);font:14px inherit;font-family:inherit;cursor:pointer}

/* ===== Ayarlar ekrani ===== */
.prof{display:flex;align-items:center;gap:12px;padding:14px;background:var(--cd);border-radius:18px}
.pav{width:52px;height:52px;border-radius:26px;background:linear-gradient(135deg,var(--ac),#E08A2B);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.pout{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:transparent;color:var(--mu);font:600 13px inherit;font-family:inherit;cursor:pointer;flex:none}
.pout:hover{color:var(--tx);border-color:var(--mu)}
.seg{display:flex;gap:4px;padding:4px;background:var(--pn);border-radius:14px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:var(--mu);font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ac);color:var(--ink)}
.seg.sm2 button{min-height:34px;font-size:13px}
.cap{margin:0;color:var(--mu);font-size:13px}.hint{margin:-6px 0 14px;color:var(--mu);font-size:12px}
.card .btn:disabled,.cform .btn:disabled{opacity:.4;cursor:default}
.empty{padding:28px 16px;border:1.5px dashed var(--ln);border-radius:14px;text-align:center;color:var(--mu);font-size:14px}
.cset{padding:0;overflow:hidden}.cset.open{box-shadow:0 0 0 1px var(--ln)}
.chead{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:transparent;color:inherit;font:inherit;font-family:inherit;text-align:left;cursor:pointer}
.cv{color:var(--mu);display:flex;transition:transform .2s}.cset.open .cv{transform:rotate(180deg)}
.cform{padding:4px 14px 14px;border-top:1px solid var(--ln);margin-top:0;padding-top:14px}
.stats.s3{grid-template-columns:repeat(3,1fr)}.stats.s3 .stat b.ok{color:#8FD6B1}
.sbox{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--cd);border:1px solid var(--ln);border-radius:12px;color:var(--mu)}
.sbox input{margin:0;border:0;background:transparent;padding:12px 0;outline:none}
.sbox:focus-within{border-color:var(--ac)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cd);border-radius:14px}
.sav{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.pill{flex:none;padding:3px 10px;border-radius:10px;background:var(--ln);color:var(--mu);font-size:11px;font-weight:600}
.pill.on{background:#1F4A3A;color:#8FD6B1}
.rbtn{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #5A2330;border-radius:10px;background:transparent;color:#F29B9B;cursor:pointer}
.rbtn:hover{background:#3A1A22}
.qrc{display:flex;flex-direction:column;gap:4px}.qrc p{margin:2px 0 0}
.qrt{align-self:center;margin:12px 0 4px;padding:12px;border-radius:20px;background:#fff;box-shadow:0 8px 24px #0006}
.qrt img,.qrw{display:block;width:min(240px,64vw);height:min(240px,64vw)}
.urlp{margin:6px 0 10px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--ln);color:var(--mu);font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;text-align:center}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools button,.tools a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;border:0;border-radius:12px;background:var(--bg);color:var(--tx);font:600 12px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.tools button:hover,.tools a:hover{background:var(--ln)}
.snack{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:24px;background:#1F4A3A;color:#BDF0D6;font-size:14px;font-weight:600;box-shadow:0 8px 24px #0008;z-index:40;white-space:nowrap}
</style>
</head>
